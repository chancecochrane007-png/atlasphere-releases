# Turns an uploaded Atlasphere build into a GitHub release that every installed copy updates from.
#
# A new version arrives on a branch named upload/vX.Y.Z containing:
#   latest.yml, <installer>.blockmap, <installer>.partNN (the installer split into pieces), notes.md
# This joins the pieces, checks them against latest.yml, publishes the release and removes the branch,
# so the installers live only in Releases and never pile up in the repository's history.
name: Publish Atlasphere release

on:
  push:
    branches: ['upload/v*']

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Join and verify the installer
        id: build
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version: *//p' latest.yml | tr -d "'\"\r")"
          FILE="$(sed -n 's/^path: *//p' latest.yml | tr -d "'\"\r")"
          WANT="$(sed -n 's/^sha512: *//p' latest.yml | tr -d "'\"\r")"
          [ "v$VERSION" = "${GITHUB_REF_NAME#upload/}" ] || { echo "Branch and latest.yml versions differ"; exit 1; }
          cat $(ls "$FILE".part* | sort) > "$FILE"
          GOT="$(openssl dgst -sha512 -binary "$FILE" | base64 -w0)"
          [ "$GOT" = "$WANT" ] || { echo "Installer checksum does not match latest.yml"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="${{ steps.build.outputs.version }}"
          F="${{ steps.build.outputs.file }}"
          NOTES=notes.md; [ -f "$NOTES" ] || echo "Atlasphere $V" > "$NOTES"
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" "$F" "$F.blockmap" latest.yml --clobber
          else
            gh release create "v$V" "$F" "$F.blockmap" latest.yml --title "Atlasphere $V" --notes-file "$NOTES" --target main --latest
          fi

      - name: Remove the upload branch
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: git push origin --delete "${GITHUB_REF_NAME}"
